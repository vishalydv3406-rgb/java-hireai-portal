name: HireAI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 21, Spring Boot 3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hireai
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & Run Unit Tests
        working-directory: backend
        run: mvn clean test -B
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/hireai
          DATABASE_USERNAME: hireai
          DATABASE_PASSWORD: hireai_secret
          AI_MOCK_ENABLED: "true"

  frontend-build:
    name: Frontend Build (React, TypeScript, Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: frontend
        run: npm run build
